services:
  gas-connect:
    build: .
    container_name: ${CONTAINER_NAME:-gas-connect}
    restart: unless-stopped
    ports:
      - "${LAN_IP:-127.0.0.1}:${WEB_PORT:-8086}:8080"
      - "${LAN_IP:-127.0.0.1}:1883:1883"
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/Berlin
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
